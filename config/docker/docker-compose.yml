version: '3.8'

services:
  gorbage:
    build: ../..
    container_name: gorbage
    ports:
      - "8080:8080"
    env_file: gorbage.env
    networks:
      - gorbage_network
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ../server:/app/certs

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file: minio.env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - gorbage_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    env_file: redis.env
    volumes:
      - redis_data:/data
    command: >
      sh -c "
        redis-server --requirepass $${REDIS_PASSWORD}
      "
    networks:
      - gorbage_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  minio_data:
    driver: local
  redis_data:
    driver: local

networks:
  gorbage_network:
    driver: bridge